<!DOCTYPE html>
<html>
<head>
    <title>Decision Tree Classifier</title>
</head>
<body>

<h1>Decision Tree Classifier App</h1>

<form action="/predict" method="post">
    <label>Enter Image ID (0-399):</label>
    <input type="number" name="image_id" min="0" max="399" required>
    <button type="submit">Predict</button>
</form>

{% if prediction %}
    <h2>{{ prediction }}</h2>
{% endif %}

</body>
</html>
